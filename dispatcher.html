<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GCPD Emergency Command - Dispatcher Dashboard</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-cyberpunk">

  <nav class="navbar">
    <div class="brand">
      <span class="brand-badge">GCPD</span>
      <h3 class="glitch" data-text="DISPATCH COMMAND" style="font-size: 1.2rem; margin: 0;">DISPATCH COMMAND</h3>
    </div>
    
    <div class="nav-links">
      <a href="index.html">CITIZEN PORTAL</a>
      <a href="dispatcher.html" class="active">DISPATCH COMMAND</a>
    </div>
  </nav>

  <div class="container" style="max-width: 1400px; display: grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
    
    <!-- LEFT: MAP -->
    <div class="cyber-border">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 class="glitch" data-text="TACTICAL OVERVIEW" style="font-size: 2rem; margin: 0;">TACTICAL OVERVIEW</h2>
        
        <div style="display: flex; gap: 1rem;">
          <div class="status-chip"><div class="status-dot"></div>FIR: <span id="countFire">0</span></div>
          <div class="status-chip"><div class="status-dot"></div>POL: <span id="countPolice">0</span></div>
          <div class="status-chip"><div class="status-dot"></div>MED: <span id="countMedical">0</span></div>
        </div>
      </div>
      
      <div id="map" class="map-container" style="height: 600px;"></div>
    </div>

    <!-- RIGHT: FEED -->
    <div class="cyber-border" style="display: flex; flex-direction: column;">
      
      <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1rem;">
        <h2 class="glitch" data-text="INCIDENT LOG" style="font-size: 1.5rem; margin: 0;">INCIDENT LOG</h2>
        <span class="meta-label">TOTAL: <span id="activeTotalLabel" style="color: #fff;">0</span></span>
      </div>

      <div class="type-grid" style="margin-bottom: 1rem;">
        <button class="cyber-btn active filter-btn" data-filter="All">ALL</button>
        <button class="cyber-btn filter-btn" data-filter="Police">POL</button>
        <button class="cyber-btn filter-btn" data-filter="Fire">FIR</button>
        <button class="cyber-btn filter-btn" data-filter="Medical">MED</button>
      </div>

      <div style="flex: 1; overflow-y: auto;">
        <table class="cyber-table">
          <thead>
            <tr>
              <th>ID/TYPE</th>
              <th>STATUS</th>
            </tr>
          </thead>
          <tbody id="reportsList">
            <!-- JS Inject -->
          </tbody>
        </table>
      </div>

      <button id="btnResetData" class="cyber-btn" style="margin-top: 1rem; font-size: 0.8rem;">
        RESET MOCK DATA
      </button>

    </div>
  </div>

  <!-- MODAL -->
  <div id="detailModal" class="cyber-modal-overlay">
    <div class="cyber-border cyber-modal-content">

      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
        <div>
          <div id="modalTypeBadge" class="status-chip" style="margin-bottom: 0.5rem;"><div class="status-dot"></div>POLICE</div>
          <h2 id="modalTitle" class="glitch" data-text="INCIDENT DETAILS" style="font-size: 2rem;">INCIDENT DETAILS</h2>
        </div>
        <button id="closeModalBtn" style="background: transparent; border: none; color: var(--cy-cyan); font-size: 2rem; cursor: pointer;">&times;</button>
      </div>

      <div class="cyber-divider"></div>

      <div class="form-group">
        <span class="meta-label">INCIDENT ID</span>
        <div id="modalId" style="font-family: var(--font-mono); color: #fff;">-</div>
      </div>
      
      <div class="form-group">
        <span class="meta-label">TIMESTAMP</span>
        <div id="modalTimestamp" style="font-family: var(--font-mono); color: #fff;">-</div>
      </div>

      <div class="form-group">
        <span class="meta-label">LOCATION</span>
        <div id="modalLocation" style="font-family: var(--font-mono); color: #fff;">-</div>
      </div>

      <div class="form-group">
        <span class="meta-label">CALLER DETAILS</span>
        <div id="modalCaller" style="font-family: var(--font-mono); color: #fff;">-</div>
      </div>

      <div class="form-group">
        <span class="meta-label">INCIDENT NOTES</span>
        <div id="modalNotes" style="font-family: var(--font-mono); color: #fff; background: rgba(0,20,25,0.4); padding: 1rem; border: 1px solid rgba(34,211,238,0.3);">-</div>
      </div>

      <div class="cyber-divider"></div>

      <div class="form-group">
        <span class="meta-label">UPDATE STATUS</span>
        <div class="type-grid">
          <button class="cyber-btn status-btn" data-status="Reported">REPORTED</button>
          <button class="cyber-btn status-btn" data-status="Dispatched">DISPATCHED</button>
          <button class="cyber-btn status-btn" data-status="Resolved">RESOLVED</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/dispatcher.js"></script>
</body>
</html>

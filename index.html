<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gotham City 911 - Citizen Emergency Portal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="theme-cyberpunk">

  <nav class="navbar">
    <div class="brand">
      <span class="brand-badge">911</span>
      <h3 class="glitch" data-text="GOTHAM CITIZEN PORTAL" style="font-size: 1.2rem; margin: 0;">GOTHAM CITIZEN PORTAL</h3>
    </div>
    
    <div class="nav-links">
      <a href="index.html" class="active">CITIZEN PORTAL</a>
      <a href="dispatcher.html">DISPATCH COMMAND</a>
    </div>
  </nav>

  <div class="container" style="max-width: 800px;">
    
    <div class="cyber-border">
      
      <h1 class="glitch" data-text="EMERGENCY REPORT" style="font-size: 3rem; margin-bottom: 2rem;">EMERGENCY REPORT</h1>
      
      <form id="emergencyForm">
        
        <div class="form-group">
          <span class="meta-label">EMERGENCY TYPE</span>
          <div class="type-grid">
            <button type="button" class="cyber-btn active" data-type="Police">POLICE</button>
            <button type="button" class="cyber-btn" data-type="Fire">FIRE</button>
            <button type="button" class="cyber-btn" data-type="Medical">MEDICAL</button>
          </div>
          <input type="hidden" id="emergencyType" value="Police">
        </div>

        <div class="form-group">
          <span class="meta-label">LOCATION</span>
          <input type="text" id="locationInput" class="cyber-input" placeholder="ENTER ADDRESS" required>
        </div>

        <div class="cyber-divider"></div>

        <div class="form-group">
          <span class="meta-label">COORDINATES</span>
          <div id="pickerMap" class="map-container"></div>
          <input type="hidden" id="latInput" value="40.7128">
          <input type="hidden" id="lngInput" value="-74.0060">
        </div>

        <div class="cyber-divider"></div>

        <div class="form-group">
          <span class="meta-label">NOTES</span>
          <textarea id="callerNotes" class="cyber-input" placeholder="DESCRIBE SITUATION..." required></textarea>
        </div>

        <div class="form-group" style="display: flex; gap: 1rem;">
          <div style="flex: 1;">
            <span class="meta-label">NAME</span>
            <input type="text" id="callerName" class="cyber-input" placeholder="NAME (OPTIONAL)">
          </div>
          <div style="flex: 1;">
            <span class="meta-label">PHONE</span>
            <input type="text" id="callerPhone" class="cyber-input" placeholder="PHONE (OPTIONAL)">
          </div>
        </div>

        <button type="submit" class="cyber-btn" style="width: 100%; margin-top: 1rem; font-size: 1.2rem; padding: 1rem;">
          SUBMIT EMERGENCY REPORT
        </button>

      </form>

      <div id="feedbackBanner" class="feedback-alert">
        <div class="status-chip" style="margin-bottom: 0.5rem;">
          <div class="status-dot"></div>
          UPLINK SECURE
        </div>
        <div style="font-family: var(--font-head); font-size: 1.5rem; font-weight: 700; text-transform: uppercase;">TRANSMISSION RECEIVED</div>
        <div id="reportIdDisplay" style="margin-top: 0.5rem; color: #fff;">REF_ID: -</div>
      </div>

    </div>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/citizen.js"></script>
</body>
</html>
